# Copy this file to .github/workflows/release.yml to enable one-click releases.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release, upload the ZIP

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Manual runs tag the current commit with the version from module/module.prop.
      # Pass context through env: so no author-controlled text is interpolated into the script.
      - name: Resolve tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(sed -n 's/^version=//p' module/module.prop | tr -d '\r')
          case "$v" in v*) ;; *) v="v$v" ;; esac
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then
            echo "Tag $v already exists. Bump version and versionCode in module/module.prop first." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "AEGIS // FIREWALL $v"
          git push origin "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"

      # Zips ./module, prechecks it with the KernelSU Modules validator, then publishes
      # draft -> upload -> publish so the release becomes immutable as a whole.
      - uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        id: release
        with:
          module-dir: module
          tag: ${{ steps.tag.outputs.name }}
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          release-notes-file: RELEASE_NOTES.md

      - env:
          ASSET_NAME: ${{ steps.release.outputs.asset-name }}
          SHA256: ${{ steps.release.outputs.sha256 }}
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
        run: |
          echo "Published ${ASSET_NAME}"
          echo "sha256 ${SHA256}"
          echo "${RELEASE_URL}"
